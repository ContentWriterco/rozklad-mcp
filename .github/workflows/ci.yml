name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
  feeds-changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check feeds added or changed in this PR
        run: |
          ids=$(git diff origin/${{ github.base_ref }} -- feeds/feeds.json | grep -E '^\+\s+"id":' | sed -E 's/.*"id": "([^"]+)".*/\1/' | tr '\n' ' ')
          if [ -n "$ids" ]; then node scripts/check-feeds.mjs $ids; else echo "no feed changes"; fi
